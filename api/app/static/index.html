<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Image Editor</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto;
         padding: 24px 18px 60px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #666; margin: 0 0 22px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
  input, textarea, button { font: inherit; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 9px 11px; border: 1px solid #ccc; border-radius: 8px;
    background: #fff; box-sizing: border-box; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button { margin-top: 18px; padding: 11px 20px; border: 0; border-radius: 8px;
    background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 16px; font-size: 14px; color: #666; min-height: 20px; }
  #status.err { color: #c0392b; }
  #result { margin-top: 14px; }
  #result img { max-width: 100%; border: 1px solid #ddd; border-radius: 8px; }
  #result a { display: inline-block; margin-top: 8px; font-size: 14px; color: #2563eb; }
  #engineered { margin-top: 12px; padding: 10px 12px; background: #f0f4ff; border: 1px solid #d6e0ff;
    border-radius: 8px; font-size: 13px; color: #333; }
  #engineered .lab { font-weight: 600; color: #2563eb; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; display: block; margin-bottom: 3px; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #999; font-weight: 400; }
</style>
</head>
<body>
  <h1>Image Editor</h1>
  <p class="sub">Upload an image, describe the change. Runs locally on FLUX.1 Kontext.</p>

  <div id="keyWrap" class="hidden">
    <label>API key <span class="hint">— required to use this service</span></label>
    <input type="password" id="apiKey" placeholder="paste your key" />
  </div>

  <label>Image</label>
  <input type="file" id="file" accept="image/png,image/jpeg,image/webp" />

  <label>Prompt</label>
  <textarea id="prompt" placeholder="e.g. show this on a restaurant background"></textarea>

  <div class="row">
    <div><label>Steps <span class="hint">(opt)</span></label><input type="text" id="steps" placeholder="28" /></div>
    <div><label>Seed <span class="hint">(opt)</span></label><input type="text" id="seed" placeholder="random" /></div>
    <div><label>Format</label><input type="text" id="fmt" placeholder="png" /></div>
  </div>

  <label style="font-weight:400;display:flex;align-items:center;gap:8px;margin-top:14px;">
    <input type="checkbox" id="enhance" checked style="width:auto;" />
    Improve my prompt automatically <span class="hint">(builds richer context for better images)</span>
  </label>

  <button id="go">Generate</button>

  <div id="status"></div>
  <div id="engineered" class="hidden"></div>
  <div id="result"></div>

<script>
const $ = (id) => document.getElementById(id);

// Show the key field only if the server requires one; remember the key locally.
fetch("/authz").then(r => r.json()).then(j => {
  if (j.auth_required) {
    $("keyWrap").classList.remove("hidden");
    $("apiKey").value = localStorage.getItem("apiKey") || "";
  }
}).catch(() => {});

function authHeaders() {
  const k = $("apiKey").value.trim();
  if (k) localStorage.setItem("apiKey", k);
  return k ? { "X-API-Key": k } : {};
}

function setStatus(msg, err) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }

$("go").onclick = async () => {
  const file = $("file").files[0];
  if (!file) { setStatus("Choose an image first.", true); return; }
  if (!$("prompt").value.trim()) { setStatus("Enter a prompt.", true); return; }

  const btn = $("go"); btn.disabled = true;
  $("result").innerHTML = "";
  setStatus("Uploading…");

  const fd = new FormData();
  fd.append("image", file);
  fd.append("prompt", $("prompt").value.trim());
  if ($("steps").value.trim()) fd.append("steps", $("steps").value.trim());
  if ($("seed").value.trim()) fd.append("seed", $("seed").value.trim());
  fd.append("output_format", $("fmt").value.trim() || "png");
  fd.append("enhance", $("enhance").checked ? "true" : "false");
  $("engineered").classList.add("hidden");

  try {
    const r = await fetch("/edit", { method: "POST", body: fd, headers: authHeaders() });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || ("Error " + r.status));
    await poll(j.job_id, Date.now());
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    btn.disabled = false;
  }
};

async function poll(jobId, t0) {
  while (true) {
    const r = await fetch("/jobs/" + jobId, { headers: authHeaders() });
    if (r.status === 401) throw new Error("Invalid API key.");
    const j = await r.json();
    const secs = Math.round((Date.now() - t0) / 1000);
    if (j.engineered_prompt) {
      const by = j.engineered_by === "llm" ? "AI-engineered prompt"
               : j.engineered_by === "template" ? "engineered prompt" : "prompt used";
      $("engineered").innerHTML = '<span class="lab">' + by + '</span>' +
        j.engineered_prompt.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
      $("engineered").classList.remove("hidden");
    }
    if (j.status === "done") {
      setStatus("Done in " + secs + "s.");
      const res = await fetch("/jobs/" + jobId + "/result", { headers: authHeaders() });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      $("result").innerHTML = '<img src="' + url + '"><br><a href="' + url +
        '" download="result.' + (j.result_format || "png") + '">Download</a>';
      return;
    }
    if (j.status === "error") throw new Error(j.error || "Generation failed.");
    setStatus((j.status === "running" ? "Generating… " : "Queued… ") + secs + "s");
    await new Promise(r => setTimeout(r, 1500));
  }
}
</script>
</body>
</html>
